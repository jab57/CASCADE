name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Python 3.12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CPU-only PyTorch
        run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          grep -v "^torch" requirements.txt | pip install -r /dev/stdin
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        run: pytest tests/ --cov=tools --cov=cascade_langgraph_workflow --cov=cascade_langgraph_mcp_server --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
